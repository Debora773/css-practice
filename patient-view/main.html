<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ευαγγελισμός - Επείγοντα</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./main-style.css" />
  </head>

  <body>
    <!-- Header -->
    <section id="title" class="primary1">
      <header
        class="d-flex flex-wrap justify-content-center py-2 border-bottom"
      >
        <a
          href="/"
          class="d-flex align-items-center mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
        >
          <div class="col d-flex align-items-start">
            <div
              class="icon-square primary2 d-inline-flex align-items-center justify-content-center flex-shrink-0 me-2 ms-3"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="currentColor"
                class="bi bi-file-earmark-medical"
                viewBox="0 0 16 16"
              >
                <path
                  d="M7.5 5.5a.5.5 0 0 0-1 0v.634l-.549-.317a.5.5 0 1 0-.5.866L6 7l-.549.317a.5.5 0 1 0 .5.866l.549-.317V8.5a.5.5 0 1 0 1 0v-.634l.549.317a.5.5 0 1 0 .5-.866L8 7l.549-.317a.5.5 0 1 0-.5-.866l-.549.317zm-2 4.5a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zm0 2a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1z"
                />
                <path
                  d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2M9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5z"
                />
              </svg>
            </div>
          </div>
          <span class="fs-5 logo">Queue R</span>
        </a>
      </header>
    </section>

    <!-- Queue number -->
    <section id="queue-number">
      <div class="card-container">
        <div class="card text-center number-card">
          <div class="card-body">
            <p class="card-title">Ο αριθμός σας</p>
            <p class="queue-number">Κ-28</p>
            <div class="clinic"><p>Καρδιολογικό</p></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Info card -->
    <section id="info-card">
      <div class="card-container">
        <div class="card text-center number-card">
          <div class="info-card-body">
            <p>Εκτιμ. χρόνος αναμονής: ~<span>1ω 30λ.</span></p>
            <hr />
            <p>Ασθενείς εν αναμονή: 11</p>
          </div>
        </div>
      </div>
    </section>

    <!-- add: 1. automated refresh, 2. footer -->
    <!-- Info card -->
    <section id="info-card">
      <div class="card-container">
        <div class="card text-center refresh-card">
          <p>Αυτόματη ανανέωση κάθε 3 δευτερόλεπτα</p>
        </div>
      </div>
    </section>

    <div class="container">
      <footer
        class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
      >
        <p class="col-md-4 mb-0 text-body-secondary">
          Ανώνυμο σύστημα - Δεν συλλέγονται προσωπικά δεδομένα
        </p>
        <ul class="nav col-md-4 justify-content-end">
          <li class="nav-item">
            <a href=".." class="nav-link px-2 text-body-secondary"
              >Επικοινωνία</a
            >
          </li>
          <li class="nav-item">
            <a href=".." class="nav-link px-2 text-body-secondary"
              >Αξιολόγηση ιστοσελίδας</a
            >
          </li>
        </ul>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
